<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Lists</title>
  <link rel="stylesheet" href="navigation.css" />
    <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9fafb;
      color: #111827;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo-box {
      width: 26px;
      height: 26px;
      border: 2px solid #111827;
      border-radius: 4px;
    }

    .brand-header h1 {
      font-size: 30px;
      margin: 0;
    }

    .user-nav {
      display: flex;
      gap: 18px;
      padding: 12px 0;
      margin-bottom: 24px;
      border-top: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
    }

    .user-nav a {
      color: #4f46e5;
      font-size: 16px;
    }

    .user-nav a[aria-current="page"] {
      color: #111827;
      font-weight: 600;
      text-decoration: none;
    }

    .page-container {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      text-decoration: none;
      color: #111827;
      font-size: 18px;
      font-weight: bold;
    }

    .back-btn:hover {
      background: #f3f4f6;
    }

    .section-header h2 {
      flex: 1;
      margin: 0;
      padding: 0 36px 0 12px;
      font-size: 22px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 3px solid #4f46e5;
      outline-offset: 3px;
    }

    @media (max-width: 540px) {
      .page-container {
        padding: 16px;
      }

      body {
        margin: 20px auto;
        padding: 0 12px;
      }

      .section-header h2 {
        font-size: 18px;
        padding-right: 24px;
      }
    }

    /* ---------- Grocery lists ---------- */

    .grocery-scroll {
        max-height: min(60vh, 480px);
        margin: 0;
        padding: 0;
        overflow-y: auto;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: white;
        list-style: none;
    }
    .grocery-item + .grocery-item {
        border-top: 1px solid #d1d5db;
    }
    .grocery-item__toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 14px 16px;
        border: 0;
        background: transparent;
        color: #111827;
        font: inherit;
        font-size: 16px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
    }
    .grocery-item__toggle:hover {
        background: #f3f4f6;
    }
    .grocery-item__toggle:focus-visible,
    .view-more-link:focus-visible,
    .route-button:focus-visible {
        outline: 3px solid #4f46e5;
        outline-offset: 2px;
    }
    .grocery-item__chevron {
        transition: transform 150ms ease;
    }
    .grocery-item.is-open .grocery-item__chevron {
        transform: rotate(180deg);
    }
    .grocery-item__panel {
        padding-bottom: 14px;
    }
    .grocery-item__ingredients {
        margin: 0;
        padding: 0 16px 8px 36px;
    }
    .grocery-item__ingredients li + li {
        margin-top: 6px;
    }
    .ingredient-qty {
        color: #6b7280;
    }
    .view-more-link {
        display: inline-block;
        margin: 0 16px 4px 36px;
        color: #4f46e5;
        font-weight: 500;
        text-decoration: underline;
    }
    .grocery-item__actions {
        display: flex;
        justify-content: flex-end;
        padding: 8px 16px 0;
    }
    .route-button {
        padding: 10px 18px;
        border: 1px solid #111827;
        background: #111827;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 500;
    }

    @media (prefers-reduced-motion: reduce) {
        .grocery-item__chevron { transition: none; }
    }
    .route-button:hover,
    .maps-button:hover {
        background: #374151;
    }
    </style>
</head>
<body>
    <div class="brand-header">
        <div class="logo-box" aria-hidden="true">M</div>
        <h1>Meal Max</h1>
    </div>

    <nav class="user-nav" aria-label="Main navigation">
        <a href="home-page.html">Home</a>
        <a href="next-meal-page.html">Next Meal</a>
        <a href="saved-recipes-page.html">Saved Recipes</a>
        <a href="grocery-lists-page.html" aria-current="page">Grocery Lists</a>
    </nav>

    <main class="page-container">
        <div class="section-header">
            <a href="home-page.html" class="back-btn" aria-label="Back to home">&lt;</a>
            <h2>My Grocery Lists</h2>
        </div>
        <ul class="grocery-scroll" id="grocery-lists"></ul>
    </main>

    <script src="grocery-data.js"></script>
    <script>
    const PREVIEW_LIMIT = 5;
    const listEl = document.getElementById('grocery-lists');
    let current = null; // the item that is currently expanded

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
    }

    function setExpanded(item, expanded) {
        item.li.classList.toggle('is-open', expanded);
        item.button.setAttribute('aria-expanded', String(expanded));
        item.panel.hidden = !expanded;
    }

    function handleToggle(item) {
        if (current && current !== item) setExpanded(current, false);
        const willOpen = current !== item;
        setExpanded(item, willOpen);
        current = willOpen ? item : null;
    }

    function buildItem(list) {
        const panelId = 'ingredients-' + list.id;
        const li = el('li', 'grocery-item');

        const button = el('button', 'grocery-item__toggle');
        button.type = 'button';
        button.setAttribute('aria-controls', panelId);
        const chevron = el('span', 'grocery-item__chevron', '▾');
        chevron.setAttribute('aria-hidden', 'true');
        button.append(el('span', '', list.name), chevron);

        const panel = el('div', 'grocery-item__panel');
        panel.id = panelId;

        const hasMore = list.ingredients.length > PREVIEW_LIMIT;
        const visible = hasMore ? list.ingredients.slice(0, PREVIEW_LIMIT) : list.ingredients;

        const ingredients = el('ul', 'grocery-item__ingredients');
        visible.forEach((ingredient) => {
            const row = el('li', '', ingredient.name + ' ');
            row.append(el('span', 'ingredient-qty', '(' + ingredient.quantity + ')'));
            ingredients.append(row);
        });
        panel.append(ingredients);

        if (hasMore) {
            const more = el('a', 'view-more-link', 'View more...');
            more.href = 'grocery-list-detail-page.html?id=' + list.id;
            panel.append(more);
        }

        const actions = el('div', 'grocery-item__actions');
        const route = el('a', 'route-button', 'Calculate route');
        route.href = 'grocery-route-page.html?id=' + list.id;
        actions.append(route);
        panel.append(actions);

        li.append(button, panel);

        const item = { li, button, panel };
        setExpanded(item, false);
        button.addEventListener('click', () => handleToggle(item));
        return li;
    }

    groceryLists.forEach((list) => listEl.append(buildItem(list)));
    </script>
</body>
</html>
