<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery List</title>
    <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9fafb;
      color: #111827;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo-box {
      width: 26px;
      height: 26px;
      border: 2px solid #111827;
      border-radius: 4px;
    }

    .brand-header h1 {
      font-size: 30px;
      margin: 0;
    }

    .user-nav {
      display: flex;
      gap: 18px;
      padding: 12px 0;
      margin-bottom: 24px;
      border-top: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
    }

    .user-nav a {
      color: #4f46e5;
      font-size: 16px;
    }

    .user-nav a[aria-current="page"] {
      color: #111827;
      font-weight: 600;
      text-decoration: none;
    }

    .page-container {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      text-decoration: none;
      color: #111827;
      font-size: 18px;
      font-weight: bold;
    }

    .back-btn:hover {
      background: #f3f4f6;
    }

    .section-header h2 {
      flex: 1;
      margin: 0;
      padding: 0 36px 0 12px;
      font-size: 22px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 3px solid #4f46e5;
      outline-offset: 3px;
    }

    @media (max-width: 540px) {
      .page-container {
        padding: 16px;
      }

      body {
        margin: 20px auto;
        padding: 0 12px;
      }

      .user-nav {
        gap: 12px;
        flex-wrap: wrap;
      }

      .user-nav a {
        font-size: 14px;
      }

      .section-header h2 {
        font-size: 18px;
        padding-right: 24px;
      }
    }

    .list-name {
        font-size: 24px;
    }
    .ingredient-scroll {
        max-height: min(60vh, 520px);
        margin: 0;
        padding: 0;
        overflow-y: auto;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        list-style: none;
    }
    .ingredient-row {
        padding: 12px 16px;
    }
    .ingredient-row + .ingredient-row {
        border-top: 1px solid #e5e7eb;
    }
    .ingredient-qty {
        color: #6b7280;
    }
    .ingredient-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }
    .remove-button {
        display: grid;
        flex: none;
        width: 32px;
        height: 32px;
        margin: -4px -6px -4px 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #6b7280;
        cursor: pointer;
        transition: background 100ms ease, color 100ms ease;
    }
    .remove-button:hover {
        background: #f3f4f6;
        color: #111827;
    }
    .remove-button:focus-visible {
        outline: 3px solid #4f46e5;
        outline-offset: 2px;
    }
    .empty-message {
        padding: 16px;
        color: #6b7280;
    }

    .store-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
        margin: 8px 0 0;
        padding: 0;
        border: 0;
    }
    .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
    }
    .store-option {
        position: relative;
    }
    .store-option input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
    }
    .store-option span {
        display: block;
        padding: 7px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #f9fafb;
        color: #111827;
        font-size: 14px;
        cursor: pointer;
        transition: background 100ms ease, box-shadow 100ms ease;
    }
    .store-option span:hover {
        background: #f3f4f6;
    }
    .store-option input:checked + span {
        border-color: #9ca3af;
        background: #d1d5db;
        box-shadow: inset 0 2px 4px rgb(0 0 0 / 25%);
    }
    .store-option input:focus-visible + span {
        outline: 3px solid #4f46e5;
        outline-offset: 2px;
    }

    .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 16px;
    }
    .route-button {
        padding: 10px 18px;
        border: 1px solid #111827;
        background: #111827;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 500;
    }
    .route-button:focus-visible {
        outline: 3px solid #4f46e5;
        outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
        .store-option span { transition: none; }
        .remove-button { transition: none; }
    }
    .route-button:hover,
    .maps-button:hover {
        background: #374151;
    }
    </style>
</head>
<body>
    <div class="brand-header">
        <div class="logo-box" aria-hidden="true"></div>
        <h1>Meal Max</h1>
    </div>

    <nav class="user-nav" aria-label="Main navigation">
        <a href="home-page.html">Home</a>
        <a href="next-meal-page.html">Next Meal</a>
        <a href="saved-recipes-page.html">Saved Recipes</a>
        <a href="grocery-lists-page.html" aria-current="page">Grocery Lists</a>
    </nav>

    <main class="page-container">
        <div class="section-header">
            <a href="grocery-lists-page.html" class="back-btn" aria-label="Back to my grocery lists">&lt;</a>
            <h2 class="list-name" id="page-title">Grocery List</h2>
        </div>
        <div id="content"></div>
    </main>

    <script src="grocery-data.js"></script>
    <script>
    const content = document.getElementById('content');
    const pageTitle = document.getElementById('page-title');

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
    }

    // Removes an ingredient from page, and doesn't save
    function removeRow(row) {
        const container = row.parentElement;
        const neighbor = row.nextElementSibling || row.previousElementSibling;
        row.remove();

        if (neighbor) {
            neighbor.querySelector('.remove-button').focus();
        } else {
            const empty = el('li', 'empty-message', 'All ingredients removed. Reload the page to bring them back.');
            empty.tabIndex = -1;
            container.append(empty);
            empty.focus();
        }
    }

    // Each ingredient row has its name and quantity, X to remove it, then its 3 stores as buttons.
    // Radio inputs make sure only one store is selected at a time
    function buildIngredientRow(list, ingredient, rowIndex) {
        const row = el('li', 'ingredient-row');

        const label = el('div', 'ingredient-name', ingredient.name + ' ');
        label.append(el('span', 'ingredient-qty', '(' + ingredient.quantity + ')'));

        const remove = el('button', 'remove-button');
        remove.type = 'button';
        remove.setAttribute('aria-label', 'Remove ' + ingredient.name);
        remove.innerHTML =
            '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">' +
            '<path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
            '</svg>';
        remove.addEventListener('click', () => removeRow(row));

        const head = el('div', 'ingredient-head');
        head.append(label, remove);

        const picker = el('fieldset', 'store-picker');
        picker.append(el('legend', 'visually-hidden', 'Store for ' + ingredient.name));

        // The first store is pressed by default, unless the user already picked another.
        const saved = getStoreIndex(list.id, ingredient.name);
        const selected = saved < ingredient.stores.length ? saved : 0;

        ingredient.stores.forEach((store, storeIndex) => {
            const option = el('label', 'store-option');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'store-' + rowIndex;
            input.value = storeIndex;
            input.checked = storeIndex === selected;
            input.addEventListener('change', () => {
                setStoreIndex(list.id, ingredient.name, storeIndex);
            });
            option.append(input, el('span', '', store));
            picker.append(option);
        });

        row.append(head, picker);
        return row;
    }

    const id = Number(new URLSearchParams(window.location.search).get('id'));
    const list = groceryLists.find((item) => item.id === id);

    if (!list) {
        document.title = 'Grocery List not found';
        pageTitle.textContent = 'List not found';
        content.append(el('p', '', 'That grocery list doesn’t exist. Go back and pick one from your lists.'));
    } else {
        document.title = list.name + ' | Grocery List';
        pageTitle.textContent = list.name;

        const ingredients = el('ul', 'ingredient-scroll');
        ingredients.setAttribute('aria-label', list.name + ' ingredients');
        list.ingredients.forEach((ingredient, rowIndex) => {
            ingredients.append(buildIngredientRow(list, ingredient, rowIndex));
        });

        const actions = el('div', 'actions');
        const route = el('a', 'route-button', 'Calculate route');
        route.href = 'grocery-route-page.html?id=' + list.id;
        actions.append(route);

        content.append(ingredients, actions);
    }
    </script>
</body>
</html>
