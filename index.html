<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Title Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9fafb;
      color: #111827;
    }
    .hero {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border: 1px solid white;
      border-radius: 12px;
    }
    .hero h1 { font-size: 32px; margin-bottom: 12px; }
    .hero p { color: #111111; font-size: 18px; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #111111;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
    }
    .btn:hover { background: #111111; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Meal Max </h1>
    <a href="home-page.html" class="btn">Get Started &rarr;</a>
  </div>
</body>
</html>
