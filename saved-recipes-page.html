<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Saved Recipes - Meal Max</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9fafb;
      color: #111827;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo-box {
      width: 26px;
      height: 26px;
      border: 2px solid #111827;
      border-radius: 4px;
    }

    .brand-header h1 {
      font-size: 30px;
      margin: 0;
    }

    .user-nav {
      display: flex;
      gap: 18px;
      padding: 12px 0;
      margin-bottom: 24px;
      border-top: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
    }

    .user-nav a {
      color: #4f46e5;
      font-size: 16px;
    }

    .user-nav a[aria-current="page"] {
      color: #111827;
      font-weight: 600;
      text-decoration: none;
    }

    .page-container {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      text-decoration: none;
      color: #111827;
      font-weight: bold;
      font-size: 18px;
    }

    .back-btn:hover {
      background: #f3f4f6;
    }

    .section-header h2 {
      font-size: 22px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 0;
      text-align: center;
      flex: 1;
      padding-right: 36px;
    }

    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .recipe-card {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #ffffff;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      overflow: hidden;
      flex-shrink: 0;
      min-height: 150px;
      transition: border-color 0.15s ease;
    }

    .recipe-card:hover {
      border-color: #111827;
    }

    .recipe-photo {
      width: 170px;
      min-height: 150px;
      background: #f3f4f6;
      border-right: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 15px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .recipe-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
    }

    .recipe-body h3 {
      font-size: 19px;
      margin: 0 0 8px 0;
      color: #111827;
    }

    .recipe-desc {
      font-size: 15px;
      color: #4b5563;
      margin: 0;
      line-height: 1.5;
    }

    .read-more-btn {
      background: none;
      border: none;
      padding: 0;
      margin-left: 6px;
      color: #4f46e5;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .read-more-btn:hover {
      text-decoration: underline;
    }

    .recipe-action {
      display: flex;
      align-items: center;
      padding: 0 18px;
    }

    .open-recipe-btn {
      background: none;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      width: 36px;
      height: 36px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: #111827;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .open-recipe-btn:hover {
      background: #111827;
      color: white;
      border-color: #111827;
    }

    .empty-state {
      text-align: center;
      color: #6b7280;
      padding: 40px 0;
      font-size: 16px;
    }
    .recipe-popup { box-sizing: border-box; width: min(560px, calc(100% - 32px)); max-height: 90vh; padding: 0; border: 1px solid #d1d5db; border-radius: 12px; color: #111827; }
    .recipe-popup::backdrop { background: rgb(17 24 39 / 55%); }
    .popup-content { padding: 24px; }
    .popup-header { display: flex; align-items: start; gap: 16px; margin-bottom: 20px; }
    .popup-header h2 { flex: 1; margin: 0; font-size: 24px; }
    .close-popup { border: 1px solid #d1d5db; border-radius: 6px; background: white; font-size: 24px; width: 36px; height: 36px; cursor: pointer; }
    .popup-image-frame { aspect-ratio: 4 / 3; }
    .popup-photo { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
    .popup-description { line-height: 1.65; margin: 20px 0 0; }
    .popup-actions { display: flex; border-top: 1px solid #d1d5db; }
    .popup-actions button { flex: 1; padding: 18px 12px; border: 0; background: #111827; color: white; font: inherit; cursor: pointer; }
    .popup-actions button + button { border-left: 1px solid #6b7280; }
    .popup-actions button:hover { background: #374151; }
    .popup-actions button[aria-pressed="true"] { background: #4f46e5; }
    .popup-status { padding: 0 24px; font-size: 14px; }
    :focus-visible { outline: 3px solid #4f46e5; outline-offset: 3px; }
    @media (max-width: 540px) {
      body { margin: 20px auto; padding: 0 12px; }
      .user-nav { gap: 12px; flex-wrap: wrap; }
      .user-nav a { font-size: 14px; }
      .page-container { padding: 16px; }
      .section-header h2 { font-size: 18px; }
      .recipe-photo { width: 100px; }
      .recipe-body { padding: 12px; min-width: 0; }
      .recipe-body h3 { font-size: 16px; }
      .recipe-action { padding: 0 8px; }
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <div class="logo-box"></div>
    <h1>Meal Max</h1>
  </div>

  <nav class="user-nav">
    <a href="home-page.html">Home</a>
    <a href="next-meal-page.html">Next Meal</a>
    <a href="saved-recipes-page.html" aria-current="page">Saved Recipes</a>
    <a href="grocery-lists-page.html">Grocery Lists</a>
  </nav>

  <main class="page-container">
    <div class="section-header">
      <a href="home-page.html" class="back-btn" title="Go back">&lt;</a>
      <h2>My Saved Recipes</h2>
    </div>

    <div id="recipe-list" class="recipe-list"></div>
  </main>

  <dialog id="recipe-popup" class="recipe-popup" aria-labelledby="popup-title">
    <div class="popup-content">
      <div class="popup-header"><h2 id="popup-title"></h2><button type="button" class="close-popup" aria-label="Close recipe">×</button></div>
      <div class="popup-image-frame"><img id="popup-photo" class="popup-photo" alt="" /></div>
      <p id="popup-description" class="popup-description"></p>
    </div>
    <div id="popup-actions" class="popup-actions"></div>
    <p id="popup-status" class="popup-status" role="status"></p>
  </dialog>

  <script>
    const defaultRecipes = [
      {
        id: 1,
        title: "Garlic Butter Salmon",
        description: "Pan-seared salmon fillets finished in a rich lemon garlic herb butter sauce. Served alongside oven-roasted asparagus spears and crispy seasoned baby potatoes for a balanced weeknight dinner.",
        photo: "assets/recipes/salmon.jpg"
      },
      {
        id: 2,
        title: "Classic Chicken Alfredo",
        description: "Creamy homemade parmesan alfredo sauce tossed with al dente fettuccine pasta, sliced herb-seasoned grilled chicken breast, cracked black pepper, and fresh chopped Italian parsley.",
        photo: "assets/recipes/alfredo.jpg"
      },
      {
        id: 3,
        title: "Veggie Teriyaki Stir Fry",
        description: "Crisp broccoli florets, sweet red bell peppers, julienned carrots, and snap peas wok-tossed in a savory homemade soy-ginger garlic glaze over fluffy steamed jasmine rice.",
        photo: "assets/recipes/stir-fry.jpg"
      },
      {
        id: 4,
        title: "Spicy Black Bean Tacos",
        description: "Warm charred corn tortillas filled with cumin-spiced black beans, smoky roasted corn salsa, sliced ripe avocado, crumbled cotija cheese, fresh cilantro, and a squeeze of lime.",
        photo: "assets/recipes/tacos.jpg"
      },
      {
        id: 5,
        title: "Mediterranean Chickpea Bowl",
        description: "Fluffy herbed quinoa topped with crispy spiced roasted chickpeas, diced English cucumbers, sweet cherry tomatoes, kalamata olives, feta cheese, and a bright lemon tahini dressing.",
        photo: "assets/recipes/chickpea-bowl.jpg"
      }
    ];
    // Replace defaultRecipes with [] later
    // Dummy recipes

    let savedRecipes;
    try { savedRecipes = JSON.parse(localStorage.getItem("savedRecipes")); } catch {}
    if (!Array.isArray(savedRecipes)) savedRecipes = defaultRecipes;
    // Fill missing images on older saved copies of the sample recipes, too.
    savedRecipes = savedRecipes.map(recipe => ({ ...recipe, photo: recipe.photo || defaultRecipes.find(sample => sample.title === recipe.title)?.photo || "assets/recipes/chickpea-bowl.jpg" }));
    const popup = document.getElementById("recipe-popup");
    const actions = document.getElementById("popup-actions");
    const status = document.getElementById("popup-status");

    function openRecipe(recipe) {
      document.getElementById("popup-title").textContent = recipe.title;
      const image = document.getElementById("popup-photo");
      image.src = recipe.photo;
      image.alt = recipe.title;
      document.getElementById("popup-description").textContent = recipe.description;
      status.textContent = "";
      popup.dataset.state = "recipe";
      actions.replaceChildren();
      const add = document.createElement("button");
      add.type = "button";
      add.textContent = "Add Ingredients +";
      add.onclick = () => {
        popup.dataset.state = "choose-list";
        actions.replaceChildren();
        ["Add to Existing", "Create New"].forEach((label, index) => {
          const option = document.createElement("button");
          option.type = "button";
          option.textContent = label;
          option.setAttribute("aria-pressed", "false");
          option.onclick = () => {
            popup.dataset.state = index === 0 ? "existing" : "new";
            actions.querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed", String(button === option)));
            status.textContent = label + " selected.";
          };
          actions.appendChild(option);
        });
        actions.querySelector("button").focus();
      };
      actions.appendChild(add);
      popup.showModal();
    }
    popup.querySelector(".close-popup").onclick = () => popup.close();
    popup.addEventListener("click", event => { if (event.target === popup) {
      const bounds = popup.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) popup.close();
    }});
    const MAX_LENGTH = 85;

    function renderRecipes() {
      const listContainer = document.getElementById("recipe-list");
      listContainer.innerHTML = "";

      if (savedRecipes.length === 0) {
        listContainer.innerHTML = `<p class="empty-state">No saved recipes yet.</p>`;
        return;
      }

      savedRecipes.forEach((recipe) => {
        const card = document.createElement("div");
        card.className = "recipe-card";

        const photoSection = recipe.photo
          ? `<img src="${recipe.photo}" alt="${recipe.title}" class="recipe-photo" />`
          : `<div class="recipe-photo">Photo</div>`;

        const isLong = recipe.description && recipe.description.length > MAX_LENGTH;
        const shortText = isLong
          ? recipe.description.slice(0, MAX_LENGTH).trim() + "..."
          : recipe.description;

        card.innerHTML = `
          ${photoSection}
          <div class="recipe-body">
            <h3>${recipe.title}</h3>
            <p class="recipe-desc">
              <span class="desc-text">${shortText}</span>
              ${isLong ? `<button type="button" class="read-more-btn">Read more</button>` : ""}
            </p>
          </div>
          <div class="recipe-action">
            <button class="open-recipe-btn" title="Open recipe">&gt;</button>
          </div>
        `;

        if (isLong) {
          let expanded = false;
          const descTextEl = card.querySelector(".desc-text");
          const readMoreBtn = card.querySelector(".read-more-btn");

          readMoreBtn.addEventListener("click", () => {
            expanded = !expanded;
            descTextEl.textContent = expanded ? recipe.description : shortText;
            readMoreBtn.textContent = expanded ? "Show less" : "Read more";
          });
        }

        card.querySelector(".open-recipe-btn").addEventListener("click", () => {
          localStorage.setItem("selectedRecipe", JSON.stringify(recipe));
          openRecipe(recipe);
        });

        listContainer.appendChild(card);
      });
    }

    renderRecipes();
  </script>
</body>
</html>
