<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Route</title>
    <style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        background: white;
        color: #111827;
    }
    .back-link {
        display: inline-block;
        margin: 28px 0 8px;
        color: #111111;
        font-weight: 500;
    }
    .list-name {
        margin: 0 0 8px;
        padding-bottom: 10px;
        border-bottom: 2px solid #111111;
        font-size: 24px;
    }
    .summary {
        margin: 0 0 20px;
        color: #6b7280;
    }
    .store-group {
        margin-bottom: 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        overflow: hidden;
    }
    .store-name {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 0;
        padding: 12px 16px;
        border-bottom: 1px solid #d1d5db;
        background: #f3f4f6;
        font-size: 18px;
    }
    .store-count {
        color: #6b7280;
        font-size: 14px;
        font-weight: 400;
    }
    .store-items {
        margin: 0;
        padding: 12px 16px 12px 36px;
    }
    .store-items li + li {
        margin-top: 6px;
    }
    .ingredient-qty {
        color: #6b7280;
    }
    .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 24px;
    }
    .maps-button {
        padding: 10px 18px;
        background: #111111;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 500;
    }
    .back-link:focus-visible,
    .maps-button:focus-visible {
        outline: 3px solid #6b7280;
        outline-offset: 2px;
    }
    </style>
</head>
<body>
    <h1>Meal Max </h1>
    <header>
        <nav>
            <a href="home-page.html" >Home</a>
            <a href="next-meal-page.html" >Next Meal</a>
            <a href="saved-recipes-page.html" >Saved Recipes</a>
            <a href="grocery-lists-page.html" >Grocery Lists</a>
        </nav>
    </header>

    <main id="content"></main>

    <script src="grocery-data.js"></script>
    <script>
    const content = document.getElementById('content');

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
    }

    function backLink() {
        const link = el('a', 'back-link', '‹ Back to my grocery lists');
        link.href = 'grocery-lists-page.html';
        return link;
    }

    function plural(count, word) {
        return count + ' ' + word + (count === 1 ? '' : 's');
    }

    // Groups the lists ingredients by the store chosen for each one on the detail page
    // Returns [{ store, items: [ingredient, ...] }, ...] sorted by store name
    function groupByStore(list) {
        const groups = new Map();
        list.ingredients.forEach((ingredient) => {
            const saved = getStoreIndex(list.id, ingredient.name);
            const store = ingredient.stores[saved < ingredient.stores.length ? saved : 0];
            if (!groups.has(store)) groups.set(store, []);
            groups.get(store).push(ingredient);
        });
        return Array.from(groups, ([store, items]) => ({ store, items })).sort((a, b) =>
            a.store.localeCompare(b.store)
        );
    }

    function buildStoreGroup(group) {
        const section = el('section', 'store-group');

        const heading = el('h3', 'store-name', group.store);
        heading.append(el('span', 'store-count', plural(group.items.length, 'item')));

        const items = el('ul', 'store-items');
        group.items.forEach((ingredient) => {
            const row = el('li', '', ingredient.name + ' ');
            row.append(el('span', 'ingredient-qty', '(' + ingredient.quantity + ')'));
            items.append(row);
        });

        section.append(heading, items);
        return section;
    }

    // Placeholder for the maps hand-off: a Google Maps directions link through each store
    function mapsUrl(groups) {
        return (
            'https://www.google.com/maps/dir/' +
            groups.map((group) => encodeURIComponent(group.store)).join('/')
        );
    }

    // The list to show comes from the address, e.g. grocery-route-page.html?id=1
    const id = Number(new URLSearchParams(window.location.search).get('id'));
    const list = groceryLists.find((item) => item.id === id);

    if (!list) {
        document.title = 'Grocery List not found';
        content.append(
            backLink(),
            el('h2', 'list-name', 'List not found'),
            el('p', '', 'That grocery list doesn’t exist. Go back and pick one from your lists.')
        );
    } else {
        document.title = list.name + ' | Shopping Route';
        const groups = groupByStore(list);

        const summary = el(
            'p',
            'summary',
            plural(list.ingredients.length, 'item') + ' at ' + plural(groups.length, 'store')
        );

        const actions = el('div', 'actions');
        const maps = el('a', 'maps-button', 'Open in Maps');
        maps.href = mapsUrl(groups);
        maps.target = '_blank';
        maps.rel = 'noopener';
        actions.append(maps);

        content.append(backLink(), el('h2', 'list-name', list.name), summary);
        groups.forEach((group) => content.append(buildStoreGroup(group)));
        content.append(actions);
    }
    </script>
</body>
</html>
