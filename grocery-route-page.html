<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Route</title>
    <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9fafb;
      color: #111827;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .logo-box {
      width: 26px;
      height: 26px;
      border: 2px solid #111827;
      border-radius: 4px;
    }

    .brand-header h1 {
      font-size: 30px;
      margin: 0;
    }

    .user-nav {
      display: flex;
      gap: 18px;
      padding: 12px 0;
      margin-bottom: 24px;
      border-top: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
    }

    .user-nav a {
      color: #4f46e5;
      font-size: 16px;
    }

    .user-nav a[aria-current="page"] {
      color: #111827;
      font-weight: 600;
      text-decoration: none;
    }

    .page-container {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 28px;
    }

    .section-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      text-decoration: none;
      color: #111827;
      font-size: 18px;
      font-weight: bold;
    }

    .back-btn:hover {
      background: #f3f4f6;
    }

    .section-header h2 {
      flex: 1;
      margin: 0;
      padding: 0 36px 0 12px;
      font-size: 22px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 3px solid #4f46e5;
      outline-offset: 3px;
    }

    @media (max-width: 540px) {
      .page-container {
        padding: 16px;
      }

      body {
        margin: 20px auto;
        padding: 0 12px;
      }

      .user-nav {
        gap: 12px;
        flex-wrap: wrap;
      }

      .user-nav a {
        font-size: 14px;
      }

      .section-header h2 {
        font-size: 18px;
        padding-right: 24px;
      }
    }

    .list-name {
        font-size: 24px;
    }
    .summary {
        margin: 0 0 24px;
        color: #4b5563;
        font-size: 15px;
        line-height: 1.5;
        text-align: center;
    }
    .store-group {
        margin-bottom: 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        overflow: hidden;
    }
    .store-name {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 0;
        padding: 12px 16px;
        border-bottom: 1px solid #d1d5db;
        background: #f3f4f6;
        font-size: 18px;
    }
    .store-count {
        color: #6b7280;
        font-size: 14px;
        font-weight: 400;
    }
    .store-items {
        margin: 0;
        padding: 12px 16px 12px 36px;
    }
    .store-items li + li {
        margin-top: 6px;
    }
    .ingredient-qty {
        color: #6b7280;
    }
    .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 24px;
    }
    .maps-button {
        padding: 10px 18px;
        border: 1px solid #111827;
        background: #111827;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 500;
    }
    .maps-button:focus-visible {
        outline: 3px solid #4f46e5;
        outline-offset: 2px;
    }
    .route-button:hover,
    .maps-button:hover {
        background: #374151;
    }
    </style>
</head>
<body>
    <div class="brand-header">
        <div class="logo-box" aria-hidden="true"></div>
        <h1>Meal Max</h1>
    </div>

    <nav class="user-nav" aria-label="Main navigation">
        <a href="home-page.html">Home</a>
        <a href="next-meal-page.html">Next Meal</a>
        <a href="saved-recipes-page.html">Saved Recipes</a>
        <a href="grocery-lists-page.html" aria-current="page">Grocery Lists</a>
    </nav>

    <main class="page-container">
        <div class="section-header">
            <a href="grocery-lists-page.html" class="back-btn" aria-label="Back to my grocery lists">&lt;</a>
            <h2 class="list-name" id="page-title">Shopping Route</h2>
        </div>
        <p class="summary" id="summary"></p>
        <div id="content"></div>
    </main>

    <script src="grocery-data.js"></script>
    <script>
    const content = document.getElementById('content');
    const pageTitle = document.getElementById('page-title');
    const summaryEl = document.getElementById('summary');

    function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
    }

    function plural(count, word) {
        return count + ' ' + word + (count === 1 ? '' : 's');
    }

    // Groups the lists ingredients by the store chosen for each one on the detail page
    // Returns [{ store, items: [ingredient, ...] }, ...] sorted by store name
    function groupByStore(list) {
        const groups = new Map();
        list.ingredients.forEach((ingredient) => {
            const saved = getStoreIndex(list.id, ingredient.name);
            const store = ingredient.stores[saved < ingredient.stores.length ? saved : 0];
            if (!groups.has(store)) groups.set(store, []);
            groups.get(store).push(ingredient);
        });
        return Array.from(groups, ([store, items]) => ({ store, items })).sort((a, b) =>
            a.store.localeCompare(b.store)
        );
    }

    function buildStoreGroup(group) {
        const section = el('section', 'store-group');

        const heading = el('h3', 'store-name', group.store);
        heading.append(el('span', 'store-count', plural(group.items.length, 'item')));

        const items = el('ul', 'store-items');
        group.items.forEach((ingredient) => {
            const row = el('li', '', ingredient.name + ' ');
            row.append(el('span', 'ingredient-qty', '(' + ingredient.quantity + ')'));
            items.append(row);
        });

        section.append(heading, items);
        return section;
    }

    // Placeholder for the maps hand-off: a Google Maps directions link through each store
    function mapsUrl(groups) {
        return (
            'https://www.google.com/maps/dir/' +
            groups.map((group) => encodeURIComponent(group.store)).join('/')
        );
    }

    // The list to show comes from the address, e.g. grocery-route-page.html?id=1
    const id = Number(new URLSearchParams(window.location.search).get('id'));
    const list = groceryLists.find((item) => item.id === id);

    if (!list) {
        document.title = 'Grocery List not found';
        pageTitle.textContent = 'List not found';
        summaryEl.textContent = 'That grocery list doesn’t exist. Go back and pick one from your lists.';
    } else {
        document.title = list.name + ' | Shopping Route';
        const groups = groupByStore(list);

        pageTitle.textContent = list.name;
        summaryEl.textContent =
            plural(list.ingredients.length, 'item') + ' at ' + plural(groups.length, 'store');

        groups.forEach((group) => content.append(buildStoreGroup(group)));

        const actions = el('div', 'actions');
        const maps = el('a', 'maps-button', 'Open in Maps');
        maps.href = mapsUrl(groups);
        maps.target = '_blank';
        maps.rel = 'noopener';
        actions.append(maps);
        content.append(actions);
    }
    </script>
</body>
</html>
